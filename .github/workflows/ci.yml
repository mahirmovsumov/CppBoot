name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++, preset: dev }
          - { compiler: clang++, preset: dev }
          - { compiler: g++, preset: asan }
          - { compiler: g++, preset: tsan }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cppboot
          POSTGRES_DB: cppboot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CXX: ${{ matrix.compiler }}
      CPPBOOT_TEST_POSTGRESQL_URL: postgresql://postgres:cppboot@localhost:5432/cppboot_test
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libyaml-cpp-dev libspdlog-dev libgtest-dev libclang-dev libboost-dev nlohmann-json3-dev libpq-dev libsqlite3-dev libssl-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      # A skipped test still counts as passed, so this stops PostgreSQL testing from silently ending.
      - name: Check that the PostgreSQL tests ran
        run: |
          output=$(build/${{ matrix.preset }}/tests/cppboot-data-tests --gtest_brief=1)
          echo "$output" | tail -n 2
          ! echo "$output" | grep -q SKIPPED

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          pacboy: gcc:p clang:p cmake:p ninja:p yaml-cpp:p spdlog:p gtest:p boost:p nlohmann-json:p postgresql:p sqlite3:p openssl:p
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
