name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++, preset: dev }
          - { compiler: clang++, preset: dev }
          - { compiler: g++, preset: asan }
          - { compiler: g++, preset: tsan }
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cppboot
          POSTGRES_DB: cppboot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CXX: ${{ matrix.compiler }}
      CPPBOOT_TEST_POSTGRESQL_URL: postgresql://postgres:cppboot@localhost:5432/cppboot_test
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libclang-dev libboost-dev nlohmann-json3-dev libpq-dev libsqlite3-dev libssl-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      # A skipped test still counts as passed, so this stops PostgreSQL testing from silently ending.
      - name: Check that the PostgreSQL tests ran
        run: |
          output=$(build/${{ matrix.preset }}/tests/cppboot-data-tests --gtest_brief=1)
          echo "$output" | tail -n 2
          ! echo "$output" | grep -q SKIPPED

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-docs.py

  # Installs a real application as a systemd service, and packages it for a clean container.
  linux-service:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev libclang-dev libboost-dev nlohmann-json3-dev libpq-dev libsqlite3-dev libssl-dev
      - run: cmake --preset release
      - run: cmake --build --preset release
      - run: cmake --install build/release --prefix "$RUNNER_TEMP/sdk"
      - run: bash scripts/test-linux-service.sh "$RUNNER_TEMP/sdk"

  # Short stress runs under the memory checker and the data race checker, with several network
  # threads, so that races between them can show up. The Stress workflow does long runs.
  linux-stress:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { checker: asan, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer" }
          - { checker: tsan, flags: "-fsanitize=thread -fno-omit-frame-pointer -DBOOST_ASIO_DISABLE_FENCED_BLOCK" }
    name: linux-stress (${{ matrix.checker }})
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev nlohmann-json3-dev libpq-dev libsqlite3-dev libssl-dev
      - name: Build
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          cmake -S . -B build/stress -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCPPBOOT_BUILD_BENCHMARKS=ON -DCPPBOOT_BUILD_TESTS=OFF \
            -DCPPBOOT_BUILD_EXAMPLES=OFF -DCPPBOOT_BUILD_CODEGEN=OFF
          cmake --build build/stress --target cppboot-stress-server cppboot-stress-client cppboot-load
      - run: bash scripts/stress-linux.sh build/stress 90 https sanitized
        env:
          STRESS_IO_THREADS: 4

  # Random input for each parser that reads text CppBoot didn't write, under the memory checker.
  # Everything is built with coverage for libFuzzer, so it can find paths inside the libraries.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libboost-dev nlohmann-json3-dev libpq-dev libsqlite3-dev libssl-dev
      - name: Build
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined" \
            -DCPPBOOT_BUILD_FUZZERS=ON -DCPPBOOT_BUILD_TESTS=OFF -DCPPBOOT_BUILD_EXAMPLES=OFF \
            -DCPPBOOT_BUILD_CODEGEN=OFF
          cmake --build build/fuzz --target cppboot-fuzzers
      - name: Fuzz
        run: |
          for fuzzer in build/fuzz/tests/fuzz/cppboot-*-fuzz; do
            name="$(basename "$fuzzer" | sed -e 's/^cppboot-//' -e 's/-fuzz$//')"
            corpus="$RUNNER_TEMP/corpus-$name"
            cp -r "tests/fuzz/corpus/$name" "$corpus"
            echo "=== $name"
            "$fuzzer" -max_total_time=120 -max_len=4096 -timeout=5 "$corpus"
          done

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          pacboy: gcc:p clang:p cmake:p ninja:p gtest:p boost:p nlohmann-json:p postgresql:p sqlite3:p openssl:p
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
