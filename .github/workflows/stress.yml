name: Stress

# Only runs when started by hand, because a long run uses many minutes.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long each run lasts
        type: number
        default: 30
      only:
        description: Run just this one, such as "asan https". Empty runs them all
        type: string
        default: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release http, build_type: Release, flags: "", protocol: http, kind: plain, database: sqlite, io_threads: 1 }
          - { name: release https, build_type: Release, flags: "", protocol: https, kind: plain, database: sqlite, io_threads: 2 }
          - { name: release postgresql, build_type: Release, flags: "", protocol: http, kind: plain, database: postgresql, io_threads: 2 }
          - { name: asan https, build_type: Debug, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer", protocol: https, kind: sanitized, database: sqlite, io_threads: 4 }
          - { name: tsan http, build_type: Debug, flags: "-fsanitize=thread -fno-omit-frame-pointer -DBOOST_ASIO_DISABLE_FENCED_BLOCK", protocol: http, kind: sanitized, database: sqlite, io_threads: 4 }
          - { name: tsan https, build_type: Debug, flags: "-fsanitize=thread -fno-omit-frame-pointer -DBOOST_ASIO_DISABLE_FENCED_BLOCK", protocol: https, kind: sanitized, database: sqlite, io_threads: 4 }
    name: ${{ matrix.name }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: cppboot
          POSTGRES_DB: cppboot_stress
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        if: inputs.only == '' || inputs.only == matrix.name
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev libpq-dev libsqlite3-dev libssl-dev
      - name: Build
        if: inputs.only == '' || inputs.only == matrix.name
        env:
          FLAGS: ${{ matrix.flags }}
          BUILD_TYPE: ${{ matrix.build_type }}
        run: |
          cmake -S . -B build/stress -G Ninja -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DCPPBOOT_BUILD_BENCHMARKS=ON -DCPPBOOT_BUILD_TESTS=OFF \
            -DCPPBOOT_BUILD_EXAMPLES=OFF -DCPPBOOT_BUILD_CODEGEN=OFF
          cmake --build build/stress --target cppboot-stress-server cppboot-stress-client cppboot-load
      - name: Run
        if: inputs.only == '' || inputs.only == matrix.name
        env:
          MINUTES: ${{ inputs.minutes }}
          PROTOCOL: ${{ matrix.protocol }}
          KIND: ${{ matrix.kind }}
          DATABASE: ${{ matrix.database }}
          STRESS_IO_THREADS: ${{ matrix.io_threads }}
        run: |
          if [ "$DATABASE" = postgresql ]; then
            export STRESS_DATABASE_URL=postgresql://postgres:cppboot@localhost:5432/cppboot_stress
          fi
          bash scripts/stress-linux.sh build/stress "$((MINUTES * 60))" "$PROTOCOL" "$KIND"
